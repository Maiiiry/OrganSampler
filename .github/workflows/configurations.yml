name: Configurations check

# The configurations folder carries organ configurations only: per folder one
# .json and its README.md. A pull request or push that puts anything else there
# fails here - audio files (samples, impulse responses), files named like pipe
# samples (036-C.wav), files of other kinds, or anything above 40 MB.
on:
  push:
    paths: [ 'configurations/**' ]
  pull_request:
    paths: [ 'configurations/**' ]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Only configurations, READMEs and IRs
        shell: bash
        run: |
          set -e
          fail=0
          while IFS= read -r -d '' f; do
            name="$(basename "$f")"
            lower="$(echo "$name" | tr '[:upper:]' '[:lower:]')"
            size=$(stat -c %s "$f")
            case "$lower" in
              *.json|readme.md) ;;
              *) echo "::error file=$f::only a configuration .json and its README.md belong in configurations/ ($name) - no samples, no impulse responses (they are part of the sample folders), nothing else"; fail=1 ;;
            esac
            if echo "$name" | grep -Eq '^[0-9]{3}[-_.]'; then
              echo "::error file=$f::named like a pipe sample ($name) - samples are never published here"; fail=1
            fi
            if [ "$size" -gt 41943040 ]; then
              echo "::error file=$f::larger than 40 MB"; fail=1
            fi
          done < <(find configurations -type f -print0)
          if [ "$fail" -ne 0 ]; then
            echo "The configurations folder takes an organ configuration (.json) and its README.md per folder - nothing else. Samples and impulse responses are bought or downloaded elsewhere (Sonus Paradisi)."
            exit 1
          fi
          echo "configurations/ is clean"
# The downloads of the configurations are made by the Website workflow
# (pages.yml): one zip per configuration under site/configurations/ and the
# list the "Organ configurations" section of the website shows.
