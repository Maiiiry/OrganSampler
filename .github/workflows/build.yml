name: Build

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.optional == true }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            artifact: OrganSampler-windows
            path: build/OrganSampler_artefacts/Release/OrganSampler.exe
          - name: macOS
            os: macos-latest
            artifact: OrganSampler-macos
            path: build/OrganSampler_artefacts/Release/OrganSampler.app
            zip: OrganSampler-macos.zip
          # A test build for old Intel Macs (macOS 10.11 El Capitan and later - the
          # lowest JUCE allows). Untested by the project itself; it must not block
          # the release when the toolchain balks.
          - name: macOS 10.11 Intel (test build)
            os: macos-latest
            artifact: OrganSampler-macos-10.11-intel
            path: build/OrganSampler_artefacts/Release/OrganSampler.app
            zip: OrganSampler-macos-10.11-intel.zip
            cmake: -DCMAKE_OSX_DEPLOYMENT_TARGET=10.11 -DCMAKE_OSX_ARCHITECTURES=x86_64 -DCMAKE_CXX_FLAGS="-faligned-allocation -D_LIBCPP_DISABLE_AVAILABILITY -Wno-unguarded-availability -Wno-unguarded-availability-new" -DCMAKE_OBJCXX_FLAGS="-faligned-allocation -D_LIBCPP_DISABLE_AVAILABILITY -Wno-unguarded-availability -Wno-unguarded-availability-new"
            optional: true
          # An experiment for macOS 10.10 Yosemite (a 2010 MacBook Pro): JUCE refuses
          # anything below 10.11 at compile time, so its check is told 10.11 while
          # the binary targets 10.10. It may compile and still crash on 10.10 where
          # JUCE touches a newer API. Never blocks the release.
          - name: macOS 10.10 Intel (experiment)
            os: macos-latest
            artifact: OrganSampler-macos-10.10-intel-experiment
            path: build/OrganSampler_artefacts/Release/OrganSampler.app
            zip: OrganSampler-macos-10.10-intel-experiment.zip
            # (the deployment target stays 10.11 so that JUCE's helper tool builds; the program itself is compiled and linked for 10.10 by the flags)
            cmake: -DCMAKE_OSX_DEPLOYMENT_TARGET=10.11 -DCMAKE_OSX_ARCHITECTURES=x86_64 -DCMAKE_CXX_FLAGS="-mmacosx-version-min=10.10 -D__MAC_OS_X_VERSION_MIN_REQUIRED=101100 -faligned-allocation -D_LIBCPP_DISABLE_AVAILABILITY -Wno-unguarded-availability -Wno-unguarded-availability-new" -DCMAKE_OBJCXX_FLAGS="-mmacosx-version-min=10.10 -D__MAC_OS_X_VERSION_MIN_REQUIRED=101100 -faligned-allocation -D_LIBCPP_DISABLE_AVAILABILITY -Wno-unguarded-availability -Wno-unguarded-availability-new" -DCMAKE_C_FLAGS="-mmacosx-version-min=10.10 -D__MAC_OS_X_VERSION_MIN_REQUIRED=101100" -DCMAKE_EXE_LINKER_FLAGS="-mmacosx-version-min=10.10"
            optional: true
          - name: Linux
            os: ubuntu-latest
            artifact: OrganSampler-linux
            path: build/OrganSampler_artefacts/Release/OrganSampler
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Linux dependencies (JUCE)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libjack-jackd2-dev ladspa-sdk libcurl4-openssl-dev \
            libfreetype-dev libfontconfig1-dev libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev libxi-dev libegl-dev libglu1-mesa-dev mesa-common-dev xvfb

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release ${{ matrix.cmake }}

      - name: Build
        run: cmake --build build --config Release --parallel

      # The engine self-test on synthetic velocity-layer folders (no audio device, no
      # window). It must not block the artifacts, so a failure only marks the step.
      - name: Self-test (engine, synthetic sample folders)
        if: runner.os != 'macOS'
        continue-on-error: true
        shell: pwsh
        run: |
          pwsh -File OrganSampler/Tests/gui/make_vel_test.ps1
          $set = Join-Path ([IO.Path]::GetTempPath()) "vel_test"
          if ($IsWindows) {
            & "build/OrganSampler_artefacts/Release/OrganSampler.exe" --selftest "$set"
            $report = Join-Path $env:APPDATA "OrganSampler/selftest.txt"
          } else {
            xvfb-run -a "build/OrganSampler_artefacts/Release/OrganSampler" --selftest "$set"
            $report = Join-Path $HOME ".config/OrganSampler/selftest.txt"
          }
          if (-not (Test-Path $report)) { throw "no self-test report at $report" }
          Get-Content $report | Select-String -Pattern 'WRONG|FAIL|COMPLETED'
          if (-not (Select-String -Path $report -Pattern 'COMPLETED WITHOUT CRASH' -Quiet)) { throw "self-test did not complete" }

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent "${{ matrix.path }}" "${{ matrix.zip }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ runner.os == 'macOS' && matrix.zip || matrix.path }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      # Every build is a pre-release for testers until the first release the
      # project is satisfied with; the badge says so on the releases page.
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          prerelease: true
          body: |
            Pre-release build for testers - not an official release yet. Windows: `OrganSampler.exe`; macOS: `OrganSampler-macos.zip` (unsigned: right-click > Open the first time; `OrganSampler-macos-10.11-intel.zip` is an untested build for old Intel Macs from macOS 10.11 on, `OrganSampler-macos-10.10-intel-experiment.zip` an experiment for 10.10 Yosemite that may not run at all); Linux: `OrganSampler` (`chmod +x` first). Changes: see `OrganSampler/CHANGELOG.md`.

            **An organ to play:** the Rural Organ demo (dry recordings with IR reverb, sample folders and configuration included) - https://github.com/zurek-jiri/OrganSampler/releases/tag/rural-organ-0.8. **More organs:** sample folders in wave format from Sonus Paradisi, https://www.sonusparadisi.cz/en/organs.html (free material: https://www.sonusparadisi.cz/en/free-stuff.html); ready-made configurations in `configurations/`.
      # Only the newest build stays on the releases page: every older v* release
      # (and its tag) is deleted; the Rural Organ demo release is kept.
      - name: Delete the older program releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current="${GITHUB_REF_NAME}"
          for tag in $(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName --jq '.[].tagName'); do
            case "$tag" in
              v*) if [ "$tag" != "$current" ]; then echo "deleting $tag"; gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag; fi ;;
            esac
          done
