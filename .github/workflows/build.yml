name: Build

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            artifact: OrganSampler-windows
            path: build/OrganSampler_artefacts/Release/OrganSampler.exe
          - name: macOS
            os: macos-latest
            artifact: OrganSampler-macos
            path: build/OrganSampler_artefacts/Release/OrganSampler.app
          - name: Linux
            os: ubuntu-latest
            artifact: OrganSampler-linux
            path: build/OrganSampler_artefacts/Release/OrganSampler
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Linux dependencies (JUCE)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libjack-jackd2-dev ladspa-sdk libcurl4-openssl-dev \
            libfreetype-dev libfontconfig1-dev libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev libxi-dev libegl-dev libglu1-mesa-dev mesa-common-dev xvfb

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      # The engine self-test on synthetic velocity-layer folders (no audio device, no
      # window). It must not block the artifacts, so a failure only marks the step.
      - name: Self-test (engine, synthetic sample folders)
        if: runner.os != 'macOS'
        continue-on-error: true
        shell: pwsh
        run: |
          pwsh -File OrganSampler/Tests/gui/make_vel_test.ps1
          $set = Join-Path ([IO.Path]::GetTempPath()) "vel_test"
          if ($IsWindows) {
            & "build/OrganSampler_artefacts/Release/OrganSampler.exe" --selftest "$set"
            $report = Join-Path $env:APPDATA "OrganSampler/selftest.txt"
          } else {
            xvfb-run -a "build/OrganSampler_artefacts/Release/OrganSampler" --selftest "$set"
            $report = Join-Path $HOME ".config/OrganSampler/selftest.txt"
          }
          if (-not (Test-Path $report)) { throw "no self-test report at $report" }
          Get-Content $report | Select-String -Pattern 'WRONG|FAIL|COMPLETED'
          if (-not (Select-String -Path $report -Pattern 'COMPLETED WITHOUT CRASH' -Quiet)) { throw "self-test did not complete" }

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent "${{ matrix.path }}" OrganSampler-macos.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ runner.os == 'macOS' && 'OrganSampler-macos.zip' || matrix.path }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
