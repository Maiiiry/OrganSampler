name: Organ configuration
description: Share a ready-made organ configuration (.json) for a set of sample folders, so others can play it at once.
title: "[Configuration] "
labels: ["configuration"]
body:
  - type: markdown
    attributes:
      value: |
        A configuration is the organ you built in OrganSampler - stop list, voicing, audio routes, couplers, combinations - saved with
        *Save Configuration*. Published configurations live in the [configurations](https://github.com/zurek-jiri/OrganSampler/tree/main/configurations)
        folder of the repository. Save it with *Portable configuration (to share with others)* ticked: OrganSampler writes the zip for the
        upload (`<name>.zip`) and its README (`<name>.README.md`) beside it - fill in the organ, the samples' producer and product and your
        name. The easiest way is the upload page: https://github.com/zurek-jiri/OrganSampler/upload/main/configurations - drag the two
        files there, press *Propose changes* and *Create pull request*; the organ then gets its folder and its line of `configurations/INDEX.md`
        by itself after the merge. If that is not possible for you, attach the zip and the README here (drag them into the "Files" field)
        and the maintainer adds them.
        **Never attach samples or impulse responses.** They are bought or downloaded elsewhere (Sonus Paradisi); a configuration only names the folders it needs.
  - type: input
    id: organ
    attributes:
      label: Organ and sample folders
      description: The instrument, and the sample folders (name, producer).
      placeholder: "Stralsund, St. Jakobi, Wegscheider 2008 - Sonus Paradisi"
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Where the samples come from
      description: A link to the page where the sample folders are sold or downloaded. The samples themselves are never published here.
      placeholder: "https://www.sonusparadisi.cz/..."
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Saved with OrganSampler version
      placeholder: "0.8.50"
    validations:
      required: true
  - type: textarea
    id: trees
    attributes:
      label: Folder trees the configuration expects
      description: The names of the sample folder trees as the configuration saved them (the Stop List shows them; "Sample folder not found" names them when they are missing).
      placeholder: |
        Library root: 003136
        Trees: 003136\pipe
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Anything the player should know that the README does not say.
  - type: textarea
    id: files
    attributes:
      label: Files
      description: Drag the zipped configuration (<name>.zip) and its README.md here. Nothing else - no samples, no impulse responses.
    validations:
      required: true
  - type: checkboxes
    id: licence
    attributes:
      label: Publication
      options:
        - label: I made this configuration myself and agree to its publication in this repository under the repository's licence (GPLv3); it contains no sample data.
          required: true
