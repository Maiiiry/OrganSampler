name: Bug report
description: Something went wrong - a crash, a dropout, a wrong sound, a dialog that misbehaves.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you. A report with the program's log bundle attached is usually fixed in the next release; one without it often cannot be.
        **The easy way:** in OrganSampler open *Configuration Editor > Report a problem...* - it fills this form in, bundles the
        activity log, crash reports, settings, the last self-test and a description of your computer and audio devices into one zip,
        takes screenshots of its windows and puts everything into a folder on your Desktop. Then drag the zip into "Logs" and the
        pictures into "Screenshots" below. Screenshots can be dragged into any text field.
  - type: input
    id: version
    attributes:
      label: OrganSampler version
      description: Shown in the window title and in Configuration Editor > About & licences.
      placeholder: "0.8.50"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows 11
        - Windows 10
        - macOS
        - Linux
    validations:
      required: true
  - type: input
    id: audio
    attributes:
      label: Audio driver and device
      description: The driver type and device of the routes involved (Divisions dialog > audio tabs).
      placeholder: "ASIO, RME Fireface UCX, buffer 256 at 48 kHz"
    validations:
      required: true
  - type: input
    id: samples
    attributes:
      label: Sample folders and configuration
      description: Which sample folders (and which organ configuration file, if you loaded one). Attach the configuration .json if the problem concerns it - never the samples.
      placeholder: "Sonus Paradisi Stralsund, my own configuration (attached)"
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw or heard, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Step by step, from the start of the program. Say whether it happens every time.
      placeholder: |
        1. Load the configuration ...
        2. Open the Divisions dialog of manual I, audio tab "Direct" ...
        3. Untick every channel ...
    validations:
      required: true
  - type: textarea
    id: system
    attributes:
      label: System
      description: Filled in by "Report a problem" (the program, the computer, the render threads, the configuration and every audio route as they were). Leave it as it is.
      render: text
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Drag logs.zip from the report folder on your Desktop here (it holds activity.log, crash logs, settings.json, selftest.txt and system.txt - no sample data). GitHub takes files only this way - no program can attach them for you. Or zip the CrashLogs folder of the application-data folder by hand.
      placeholder: Drag the zip file into this field.
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Drag images here - the pictures from the report folder (the program's windows at the time) and any of your own.
  - type: textarea
    id: hardware
    attributes:
      label: Computer
      description: CPU, RAM, audio interface. (The report's system.txt has this; then leave it empty.)
      placeholder: "AMD Ryzen 9 5950X, 64 GB, RME Fireface UCX"
